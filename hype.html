<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1920" />
<title>NPCity — hype reel</title>
<!-- A scripted 1920×1080 reel for NPCity: the plaza (everyone strolling, sitting, riding, standing about with a
     coffee, the paper or a phone) on the left, one featured citizen at a time on the right cycling through actions,
     rigging and cartoon styles. It is time-driven (window.__frame(t)) so tools/record-hype.mjs can render it frame
     by frame; opened normally it just plays. -->
<style>
  @font-face { font-family: 'Caveat'; font-weight: 700; src: url(./fonts/caveat-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Patrick Hand'; font-weight: 400; src: url(./fonts/patrick-hand-latin-400-normal.woff2) format('woff2'); }
  :root { --paper: #f6efdf; --paper2: #efe4cc; --ink: #2a2230; --ink2: #5a4e5e; --accent: #e8604c; --gold: #e4b84f; --mint: #3f8f88; --sketch: 255px 14px 225px 16px / 16px 225px 14px 255px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--paper2); font-family: 'Patrick Hand', cursive; color: var(--ink); }
  #plaza { position: absolute; left: 0; top: 0; width: 1260px; height: 1080px; }
  #feat { position: absolute; left: 1260px; top: 0; width: 660px; height: 1080px; background: var(--paper); border-left: 5px solid var(--ink); }
  canvas { display: block; }
  #fc { position: absolute; left: 0; top: 140px; width: 660px; height: 610px; border-top: 3px dashed rgba(42,34,48,.35); border-bottom: 3px dashed rgba(42,34,48,.35); }
  .pill { position: absolute; background: var(--paper); border: 3px solid var(--ink); border-radius: var(--sketch); box-shadow: 4px 5px 0 rgba(42,34,48,.85); }
  #tag { left: 36px; top: 34px; padding: 10px 26px 12px; background: var(--accent); color: #fff7ea; font-family: 'Caveat'; font-weight: 700; font-size: 54px; line-height: 1; transform: rotate(-2deg); letter-spacing: .5px; }
  #tag small { display: block; font-family: 'Patrick Hand'; font-size: 22px; letter-spacing: 3px; opacity: .92; margin-bottom: 2px; }
  #cap { left: 36px; bottom: 34px; padding: 10px 22px; font-size: 30px; transform: rotate(-.6deg); }
  #cap b { font-family: 'Caveat'; font-size: 40px; color: var(--accent); margin-right: 8px; }
  #hd { position: absolute; left: 0; top: 0; width: 660px; height: 150px; padding: 26px 34px 0; }
  #hd .k { font-size: 24px; letter-spacing: 3px; color: var(--ink2); }
  #hd .n { font-family: 'Caveat'; font-weight: 700; font-size: 74px; line-height: 1; margin-top: 2px; }
  #hd .n span { color: var(--accent); font-size: 40px; margin-left: 10px; }
  #chips { position: absolute; left: 30px; top: 772px; width: 600px; display: grid; grid-template-columns: 1fr; gap: 12px; }
  .chip { min-width: 0; overflow: hidden; display: flex; align-items: center; gap: 16px; padding: 4px 20px; font-size: 30px; border: 3px solid var(--ink); border-radius: var(--sketch); background: #fff9ea; box-shadow: 3px 4px 0 rgba(42,34,48,.85); }
  .chip i { font-style: normal; font-size: 21px; letter-spacing: 3px; color: var(--ink2); width: 130px; }
  .chip b { font-family: 'Caveat'; font-size: 42px; line-height: 1.05; white-space: nowrap; }
  .chip.hot { background: var(--gold); }
  #dots { position: absolute; left: 0; top: 1050px; width: 660px; display: flex; gap: 12px; justify-content: center; }
  #dots u { width: 22px; height: 12px; border: 2.5px solid var(--ink); border-radius: 8px; background: transparent; }
  #dots u.on { background: var(--ink); }
  #load { position: absolute; inset: 0; display: grid; place-items: center; font-family: 'Caveat'; font-size: 64px; background: var(--paper2); z-index: 5; }
</style>
</head>
<body>
<div id="plaza"></div>
<div id="feat">
  <div id="hd"><div class="k">FEATURED CITIZEN</div><div class="n" id="who">…</div></div>
  <div id="fc"></div>
  <div id="chips">
    <div class="chip hot"><i>ACTION</i><b id="cAct">…</b></div>
    <div class="chip"><i>STYLE</i><b id="cSty">…</b></div>
    <div class="chip"><i>RIG</i><b id="cRig">76 bones · 8 baked clips</b></div>
  </div>
  <div id="dots"></div>
</div>
<div class="pill" id="tag"><small>7 DAYS OF VIBES · DAY 6</small>NPCity</div>
<div class="pill" id="cap"><b>NPCity</b>browser based citizens on demand</div>
<div id="load">sketching the town…</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { makePerson } from './js/people.js';
import { makeBike } from './js/motion.js';
import { paint, ink, styleTick, blobShadow } from './js/style.js';
import { RENDER_STYLES, applyRenderStyle, applySceneStyle } from './js/render-styles.js';
import { generateCitizens, toPersonSpec } from './js/citizens.js';

const q = new URLSearchParams(location.search), $ = (s) => document.querySelector(s);
const SEED = q.get('seed') || 'npcity', CROWD = +(q.get('crowd') || 12), PLAZA_STYLE = 'gouache';
// the featured reel: who (index into the crowd), doing what, drawn how
const SEGS = [
  { i: 0, act: 'walk', style: 'gouache', label: 'Walk' },
  { i: 3, act: 'bike', style: 'anime', label: 'Bike' },
  { i: 2, act: 'coffee', style: 'watercolor', label: 'Coffee break' },
  { i: 5, act: 'run', style: 'comic', label: 'Run' },
  { i: 7, act: 'read', style: 'sketch', label: 'Read the paper' },
  { i: 1, act: 'sit', style: 'flat', label: 'Sit' },
  { i: 4, act: 'phone', style: 'clay', label: 'Phone' },
];
const SEG_T = 3.6, DURATION = SEGS.length * SEG_T;
window.__duration = DURATION;

// ── the plaza ──
const pr = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); pr.setPixelRatio(1); pr.setSize(1260, 1080); $('#plaza').append(pr.domElement);
const ps = new THREE.Scene(), pcam = new THREE.PerspectiveCamera(32, 1260 / 1080, 0.1, 100);
const sun = () => { const s = new THREE.DirectionalLight(0xfff2d8, 1.6); s.position.set(14, 22, 10); return s; };
ps.add(new THREE.HemisphereLight(0xfff6e8, 0xd8c8b0, 1.35), sun());
applySceneStyle(pr, ps, PLAZA_STYLE, { dpr: 1 });
const ground = new THREE.Mesh(new THREE.CircleGeometry(5.6, 64).rotateX(-Math.PI / 2), paint(0xe9dcc0, { hatch: 0.4 })); ground.position.y = -0.002;
const bench = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.44, 0.42), paint(0x8a6a4e)); bench.position.set(0, 0.22, -0.3); ink(bench, 'fine');
const scenery = new THREE.Group(); scenery.add(ground, bench); applyRenderStyle(scenery, PLAZA_STYLE); ps.add(scenery);

const crowd = generateCitizens(CROWD, { seed: SEED, ageMin: 9, ageMax: 78 });
const folk = [];
for (let i = 0; i < crowd.length; i++) {
  $('#load').textContent = `sketching ${i + 1} of ${crowd.length}…`;
  const p = await makePerson(toPersonSpec(crowd[i], { render: PLAZA_STYLE }));
  const role = i === 1 ? 'sit' : i % 4 === 3 ? 'bike' : i % 5 === 2 ? 'stand' : 'walk';
  const ringN = role === 'bike' ? 3 : i % 3, onRing = Math.ceil(crowd.length / 3);
  const f = { p, role, r: 1.5 + ringN * 0.8, a0: (Math.floor(i / 3) / onRing) * Math.PI * 2 + ringN, dir: ringN % 2 ? 1 : -1, t0: i * 1.37 };
  if (role === 'bike') { f.bike = makeBike(p); p.group.add(f.bike.group); applyRenderStyle(f.bike.group, PLAZA_STYLE); }
  if (role === 'sit') p.group.position.set(0.3, 0, -0.25 - p.motion.M.hipMid.z);
  if (role === 'stand') {
    const a = (i * 2.399) % (Math.PI * 2), R2 = 4.6, B = p.motion.BYSTANDERS;
    f.act = B[i % B.length];
    p.group.position.set(Math.cos(a) * R2, 0, Math.sin(a) * R2); p.group.rotation.y = Math.atan2(-Math.cos(a), -Math.sin(a));
  }
  p.group.add(blobShadow(0.3)); ps.add(p.group); folk.push(f);
}

// ── the featured citizen ──
const fr = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); fr.setPixelRatio(1); fr.setSize(660, 610); $('#fc').append(fr.domElement);
const fs = new THREE.Scene(), fcam = new THREE.PerspectiveCamera(30, 660 / 610, 0.05, 80);
fs.add(new THREE.HemisphereLight(0xfff6e8, 0xd8c8b0, 1.35), sun());
const fground = new THREE.Mesh(new THREE.CircleGeometry(1.1, 64).rotateX(-Math.PI / 2), paint(0xe9dcc0, { hatch: 0.4 })); fground.position.y = -0.002; fs.add(fground);
const feats = [];
for (const [k, s] of SEGS.entries()) {
  $('#load').textContent = `drawing the stars ${k + 1} of ${SEGS.length}…`;
  const c = crowd[s.i % crowd.length], p = await makePerson(toPersonSpec(c, { render: s.style }));
  const g = new THREE.Group(); g.add(p.group); g.visible = false; fs.add(g);
  let bike = null;
  if (s.act === 'bike') { bike = makeBike(p); p.group.add(bike.group); applyRenderStyle(bike.group, s.style); }
  if (s.act === 'sit') {
    const h = p.motion.M.knee.L.y * 0.97, b = new THREE.Mesh(new THREE.BoxGeometry(0.5, h, 0.42), paint(0x8a6a4e));
    b.position.set(0, h / 2, p.motion.M.hipMid.z - 0.12); ink(b, 'fine'); const bg = new THREE.Group(); bg.add(b); applyRenderStyle(bg, s.style); p.group.add(bg);
  }
  p.group.add(blobShadow(0.3));
  feats.push({ ...s, c, p, g, bike });
}
$('#dots').innerHTML = SEGS.map(() => '<u></u>').join('');
$('#load').remove();

// ── one frame at time t (seconds) ──
let shown = -1;
function frame(t) {
  // plaza: deterministic in t, so a recording is the same every time
  for (const f of folk) {
    const m = f.p.motion, tt = t + f.t0;
    if (f.role === 'sit') { m.pose('sit', tt, { seatY: 0.44 }); continue; }
    if (f.role === 'stand') { m.pose(f.act, tt); continue; }
    const v = f.role === 'bike' ? m.speed('walk') * 2.4 : m.speed('walk'), a = f.a0 + f.dir * v / f.r * t;
    f.p.group.position.set(Math.cos(a) * f.r, 0, Math.sin(a) * f.r);
    f.p.group.rotation.y = Math.atan2(-Math.sin(a) * f.dir, Math.cos(a) * f.dir);
    m.pose(f.role, tt, f.bike ? { bike: f.bike, speed: v } : {});
  }
  const ca = 0.6 + t * 0.07;
  pcam.position.set(Math.sin(ca) * 8.2, 3.6, Math.cos(ca) * 8.2); pcam.lookAt(0, 0.6, 0);
  styleTick(t, 1260, 1080); pr.render(ps, pcam);

  // featured: which segment, and its own little turn
  const k = Math.min(SEGS.length - 1, Math.floor(t / SEG_T)), u = t - k * SEG_T, F = feats[k];
  if (k !== shown) {
    feats.forEach((x, j) => x.g.visible = j === k);
    applySceneStyle(fr, fs, F.style, { dpr: 1 }); fr.setPixelRatio(1); applyRenderStyle(fground, F.style);
    $('#who').innerHTML = `${F.c.name}<span>${Math.round(F.c.age)}</span>`;
    $('#cAct').textContent = F.label; $('#cSty').textContent = RENDER_STYLES[F.style].label;
    [...$('#dots').children].forEach((d, j) => d.classList.toggle('on', j <= k));
    shown = k;
  }
  const m = F.p.motion;
  m.pose(F.act, u + 2, F.bike ? { bike: F.bike, speed: m.speed('walk') * 2.2 } : {});
  F.g.rotation.y = 0.55 - 0.9 * (u / SEG_T);
  const H = F.p.body.P.stature, ty = F.act === 'sit' ? H * 0.38 : H * 0.5, span = H * (F.act === 'bike' ? 1.35 : 1.15);
  const dist = span / 2 / Math.tan(THREE.MathUtils.degToRad(15)) / Math.min(1, fcam.aspect * 1.1);
  fcam.position.set(0, ty + dist * 0.12, dist); fcam.lookAt(0, ty, 0);
  styleTick(t, 660, 610); fr.render(fs, fcam);
}
window.__frame = (t) => frame(t);
window.__ready = true;

if (!q.has('record')) {                                    // just play it, looping
  const t0 = performance.now();
  const loop = () => { frame(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
